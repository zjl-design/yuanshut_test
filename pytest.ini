[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v 
    --tb=short 
    --strict-markers
    --cov=src 
    --cov-report=term-missing 
    --cov-report=html:reports/coverage 
    --html=reports/report.html
markers =
    slow: 慢速测试
    integration: 集成测试
