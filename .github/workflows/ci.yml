# GitHub Actions CI/CD 配置
name: Test Automation

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install requests responses pytest-json-report

      - name: Run Mock tests
        env:
          MOCK_MODE: true
        run: |
          pytest tests/test_api_mock.py -v \
            --html=reports/mock_report.html --self-contained-html \
            --json-report --json-report-file=reports/test_results.json \
            --tb=short -rA

      - name: Generate test summary
        run: |
          python << 'EOF'
import json
import os

summary_file = 'reports/summary.txt'
os.makedirs('reports', exist_ok=True)

try:
    with open('reports/test_results.json', 'r') as f:
        data = json.load(f)

    total = data.get('summary', {}).get('total', 0)
    passed = data.get('summary', {}).get('passed', 0)
    failed = data.get('summary', {}).get('failed', 0)
    error = data.get('summary', {}).get('error', 0)
    skipped = data.get('summary', {}).get('skipped', 0)
    duration = data.get('duration', 0)

    lines = []
    lines.append("=== 测试统计 ===")
    lines.append(f"总用例数: {total}")
    lines.append(f"通过: {passed}")
    lines.append(f"失败: {failed}")
    lines.append(f"错误: {error}")
    lines.append(f"跳过: {skipped}")
    lines.append(f"耗时: {duration:.2f}s")
    if total > 0:
        lines.append(f"通过率: {passed/total*100:.1f}%")
    else:
        lines.append("通过率: N/A")

    with open(summary_file, 'w', encoding='utf-8') as f:
        f.write('\n'.join(lines))

    print('\n'.join(lines))
except Exception as e:
    print(f"生成摘要失败: {e}")
EOF

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ github.run_number }}
          path: |
            reports/*.html
            reports/*.json
            reports/*.txt
          retention-days: 14

      - name: Comment test summary on PR
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            try {
              const summary = fs.readFileSync('reports/summary.txt', 'utf8');
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: '## 测试结果摘要\n```\n' + summary + '\n```'
              });
            } catch (e) {
              console.log('Comment failed:', e.message);
            }
