# GitHub Actions CI/CD 配置
name: Test Automation

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install requests responses pytest-json-report

      - name: Run Mock tests
        env:
          MOCK_MODE: true
        run: |
          pytest tests/test_api_mock.py -v \
            --html=reports/mock_report.html --self-contained-html \
            --json-report --json-report-file=reports/test_results.json \
            --tb=short -rA

      - name: Generate test summary
        run: python scripts/generate_summary.py

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ github.run_number }}
          path: |
            reports/*.html
            reports/*.json
            reports/*.txt
          retention-days: 14

      - name: Comment test summary on PR
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            try {
              const summary = fs.readFileSync('reports/summary.txt', 'utf8');
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: '## 测试结果摘要\n```\n' + summary + '\n```'
              });
            } catch (e) {
              console.log('Comment failed:', e.message);
            }